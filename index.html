<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仕女小聚｜ESG 文化美學系列</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F4EDE1; --paper-deep:#EAE0CC; --ink:#3B2E24; --ink-soft:#6B5A48; --wine:#7B4B45; --wine-deep:#5C3733; --gold:#B08D57; --line:#C9B79A; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Serif TC", serif;}
  .wrap{max-width:640px;margin:0 auto;position:relative;}
  .top-nav { position: sticky; top: 0; background: rgba(244, 237, 225, 0.95); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); z-index: 100; }
  .nav-item { font-size: 13px; background: var(--paper-deep); padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; text-decoration: none; color: var(--ink); }
  .hero { aspect-ratio: 16 / 9; overflow: hidden; }
  .banner-img { width: 100%; display: block; }
  .signup-card { background: var(--paper-deep); border: 1px solid var(--line); border-radius: 8px; padding: 26px 22px; margin: 20px; }
  .field { margin-bottom: 16px; }
  input, select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 5px; }
  .signup-btn { width: 100%; padding: 14px; background: var(--wine-deep); color: white; border: none; border-radius: 999px; cursor: pointer; font-weight: 700; margin-top: 10px; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .checkout-card { background: var(--paper); padding: 24px; width: 90%; max-width: 500px; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="top-nav">
    <div style="font-weight:700; color:var(--wine-deep);">仕女小聚</div>
    <div class="nav-item" onclick="document.getElementById('signup-form').scrollIntoView()">立即報名</div>
  </nav>
  
  <div class="hero"><img class="banner-img" src="watermarked_img_13493820410911707551.png" alt="banner"></div>

  <div class="signup" id="signup-form">
    <div class="signup-card">
      <form id="main-signup-form">
        <div class="field"><label>姓名</label><input type="text" id="p1-name" name="name" required></div>
        <div class="field"><label>電話</label><input type="tel" id="p1-phone" name="phone" required></div>
        <div class="field"><label>Email</label><input type="email" id="p1-email" name="email" required></div>
        <div class="field"><label>身分證字號</label><input type="text" id="p1-id" name="idCard" required></div>
        <div class="field"><label>出生年月日</label><input type="date" id="p1-dob" name="birthday" required></div>
        <button type="button" class="signup-btn" onclick="openCheckout()">確認報名</button>
      </form>
    </div>
  </div>
</div>

<div class="modal-overlay" id="checkout-modal">
  <div class="checkout-card">
    <h3 style="margin-bottom:15px;">確認送出報名？</h3>
    <button type="button" class="signup-btn" id="submit-btn" onclick="submitToGoogleSheet()">確定送出</button>
    <button type="button" class="signup-btn" style="background:#6B5A48;" onclick="closeCheckout()">返回修改</button>
  </div>
</div>

<script>
  // 您的部署網址
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxy4c5tFj4lIWG2cQGTf2MvoE9HZvHGwdqp28elN60uxlS-jjSfKF7W5LbKSoECxZlv/exec';

  function openCheckout() {
    if (document.getElementById('main-signup-form').checkValidity()) {
      document.getElementById('checkout-modal').classList.add('active');
    } else {
      document.getElementById('main-signup-form').reportValidity();
    }
  }

  function closeCheckout() { document.getElementById('checkout-modal').classList.remove('active'); }

  function submitToGoogleSheet() {
    const btn = document.getElementById('submit-btn');
    btn.innerText = '提交中...';
    btn.disabled = true;

    const formData = {
      action: 'saveEventOrder', // 這對應我們在後端寫的 saveEventOrder
      name: document.getElementById('p1-name').value,
      phone: document.getElementById('p1-phone').value,
      email: document.getElementById('p1-email').value,
      idCard: document.getElementById('p1-id').value,
      birthday: document.getElementById('p1-dob').value,
      eventName: "仕女小聚 001",
      peopleCount: "1位"
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(formData)
    }).then(() => {
      alert('報名成功！');
      location.reload();
    }).catch(err => {
      alert('錯誤，請檢查網路');
      btn.disabled = false;
      btn.innerText = '確定送出';
    });
  }
</script>
</body>
</html>
